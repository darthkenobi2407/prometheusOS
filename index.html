<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">


  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>prometheusOS</title>

  <link rel="stylesheet" href="style.css">

</head>




<body>

  <header class="menu-bar">

    <nav class="menu-left" aria-label="Main menu">

      <button class="brand-menu menu-trigger" data-menu="system" aria-label="PrometheusOS menu"><span class="brand-mark">home</span></button>

      <span id="current-app-name" class="app-name" aria-live="polite"></span>

      <button class="menu-trigger" data-menu="help">Help</button>

    </nav>

    <div class="menu-right"><span id="clock"></span></div>

    <div id="menu-popovers" class="menu-popovers"></div>

  </header>




  <main class="desktop">

    <nav class="desktop-icons" aria-label="Applications">

      <button data-app="notes" aria-label="Open Notes"><span class="app-icon notes-icon">n</span><span>Notes</span></button>

      <button data-app="terminal" aria-label="Open Terminal"><span class="app-icon terminal-icon">T</span><span>Terminal</span></button>

      <button data-app="about" aria-label="Open About"><span class="app-icon about-icon">a</span><span>About</span></button>

      <button data-app="website" aria-label="Open My Projects"><span class="app-icon website-icon">m</span><span>My Projects</span></button>

      <button data-app="formula1" aria-label="Open Formula 1"><span class="app-icon f1-icon">f1</span><span>Formula 1</span></button>

    </nav>

    <section id="windows" aria-live="polite"></section>

    <nav class="dock" aria-label="Dock">

      <button data-app="notes" title="Notes" aria-label="Open Notes"><span class="app-icon notes-icon">n</span></button>

      <button data-app="terminal" title="Terminal" aria-label="Open Terminal"><span class="app-icon terminal-icon">T</span></button>

      <button data-app="about" title="About PrometheusOS" aria-label="Open About"><span class="app-icon about-icon">a</span></button>

      <button data-app="website" title="My Projects" aria-label="Open My Projects"><span class="app-icon website-icon">m</span></button>

      <button data-app="formula1" title="Formula 1" aria-label="Open Formula 1"><span class="app-icon f1-icon">f1</span></button>

    </nav>

  </main>

<script src="script.js"></script>

</body>

</html>
